<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Iconos — Blower Ctrl</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 32px;
    }
    h1 { font-size: 1.1rem; color: #9ca3af; letter-spacing: 0.06em; text-transform: uppercase; }
    .group { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    h3 { font-size: 0.8rem; color: #9ca3af; font-weight: 400; }
    canvas { border-radius: 22%; }
    button {
      padding: 10px 28px;
      background: #f97316;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
    p { font-size: 0.78rem; color: #6b7280; max-width: 340px; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>

  <h1>Generador de Iconos</h1>

  <div class="group">
    <h3>192 × 192</h3>
    <canvas id="c192" width="192" height="192"></canvas>
    <button onclick="download('c192', 'icon-192.png')">Descargar icon-192.png</button>
  </div>

  <div class="group">
    <h3>512 × 512</h3>
    <canvas id="c512" width="512" height="512"></canvas>
    <button onclick="download('c512', 'icon-512.png')">Descargar icon-512.png</button>
  </div>

  <p>Guarda ambos archivos en la carpeta raíz del proyecto junto a index.html.</p>

  <script>
    function drawIcon(id) {
      const canvas = document.getElementById(id)
      const s = canvas.width
      const ctx = canvas.getContext('2d')
      const cx = s / 2, cy = s / 2
      const r = s * 0.38

      // Background
      ctx.fillStyle = '#1a1a1a'
      ctx.fillRect(0, 0, s, s)

      // Orange circle
      ctx.beginPath()
      ctx.arc(cx, cy, r, 0, Math.PI * 2)
      ctx.fillStyle = '#f97316'
      ctx.fill()

      // Fan blades
      ctx.save()
      ctx.translate(cx, cy)
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'
      ctx.lineWidth = s * 0.045
      ctx.lineCap = 'round'
      for (let i = 0; i < 4; i++) {
        ctx.save()
        ctx.rotate((Math.PI / 2) * i + Math.PI / 8)
        ctx.beginPath()
        ctx.moveTo(s * 0.03, 0)
        ctx.bezierCurveTo(r * 0.3, -r * 0.1, r * 0.55, -r * 0.5, r * 0.62, -r * 0.25)
        ctx.stroke()
        ctx.restore()
      }

      // Center hub
      ctx.beginPath()
      ctx.arc(0, 0, s * 0.055, 0, Math.PI * 2)
      ctx.fillStyle = '#fff'
      ctx.fill()
      ctx.restore()
    }

    function download(id, filename) {
      const canvas = document.getElementById(id)
      const a = document.createElement('a')
      a.download = filename
      a.href = canvas.toDataURL('image/png')
      a.click()
    }

    drawIcon('c192')
    drawIcon('c512')
  </script>

</body>
</html>
